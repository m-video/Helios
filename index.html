@keyframes hx-progress {
  from {
    transform: scaleX(0);
  }
  to {
    transform: scaleX(1);
  }
}
@keyframes hx-rise {
  from {
    opacity: 0;
    transform: translateY(12px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@keyframes hx-pulse-dot {
  0%, 100% {
    box-shadow: 0 0 0 0 rgba(240, 130, 58, 0.6);

  50% {

.hx-enter {
